name: discover

# Once a week, looks on GitHub for plugin repositories (topics in tools/catalog.py: deckhost-plugin,
# streamdeck-plugin, stream-deck-plugin, openaction-plugin) with a plugin file in a release that
# aren't listed yet, and opens one pull request with their entries. Nothing is listed until a
# maintainer reviews and merges it.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: New plugins
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/catalog.py discover
      - name: The pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "$(git status --porcelain plugins)" ]]; then
            echo "Nothing new."
            exit 0
          fi
          branch="discover/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add plugins
          git commit -m "Plugins found on GitHub"
          git push --force origin "$branch"
          list="$(git show --name-only --format= HEAD | sed 's/^/- /')"
          title="Plugins found on GitHub ($(date -u +%Y-%m-%d))"
          body="$(printf 'Found by the discover workflow (repository topics and releases). Review each before merging: the code, the license, the description.\n\n%s' "$list")"
          if pr="$(gh pr create --head "$branch" --title "$title" --body "$body")" \
             || pr="$(gh pr view "$branch" --json url --jq .url 2>/dev/null)"; then
            echo "$pr"
          else
            # Without "Allow GitHub Actions to create and approve pull requests" (Settings > Actions >
            # General) the token can push but not open the pull request: leave a link to open it by hand.
            compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$GITHUB_REF_NAME...$branch?expand=1"
            echo "::warning::Could not open the pull request. Open it from $compare"
            printf '### Plugins found on GitHub\n\nThe branch `%s` is pushed; [open the pull request](%s).\n\n%s\n' \
              "$branch" "$compare" "$list" >> "$GITHUB_STEP_SUMMARY"
          fi
