name: publish

# Builds catalog.json from plugins/*.json (with newer versions from the catalog-updates branch on
# top) and publishes it on this repository's GitHub Pages
# (Settings → Pages → Source: GitHub Actions). DeckHost reads
# https://<owner>.github.io/deckhost-plugins/catalog.json.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # The update workflow calls it after committing (its own push doesn't start workflows).
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # Newer versions from the update workflow (the catalog-updates branch), applied on top.
      - name: Updates
        run: |
          if git ls-remote --exit-code --heads origin catalog-updates >/dev/null; then
            git fetch --depth 1 origin catalog-updates
            git worktree add overrides FETCH_HEAD
          fi
          mkdir -p overrides/updates
      - run: python3 tools/catalog.py build site/catalog.json --overrides overrides/updates
      # The Elgato mirror (mirror workflow): its catalog, notice and icons, when it has run.
      - name: Mirror
        run: |
          if git ls-remote --exit-code --heads origin mirror-data >/dev/null; then
            git fetch --depth 1 origin mirror-data
            git worktree add mirror-data FETCH_HEAD
            mkdir -p site/mirror
            cp mirror-data/catalog.json mirror-data/NOTICE.md site/mirror/
            if [[ -d mirror-data/icons ]]; then cp -r mirror-data/icons site/mirror/; fi
          fi
      # Pages deployed from Actions doesn't run Jekyll, so the README must be real HTML to be served at /.
      - name: Index page
        run: |
          pip install --quiet markdown
          python3 - <<'PY'
          import html, markdown
          body = markdown.markdown(open("README.md", encoding="utf-8").read(), extensions=["tables", "fenced_code"])
          page = ("<!doctype html><html lang=en><meta charset=utf-8>"
                  "<meta name=viewport content='width=device-width,initial-scale=1'>"
                  "<title>DeckHost plugins</title>"
                  "<style>body{font:16px/1.6 system-ui,sans-serif;max-width:48rem;margin:2rem auto;padding:0 1rem}"
                  "pre,code{background:#8881;border-radius:4px}pre{padding:.75rem;overflow:auto}"
                  "table{border-collapse:collapse}td,th{border:1px solid #8886;padding:.3rem .6rem}</style>"
                  "<body>" + body)
          open("site/index.html", "w", encoding="utf-8").write(page)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
