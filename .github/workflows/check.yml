name: check

# Checks the plugin entries a pull request adds or changes: the fields, the package (checksum, id
# and version) and that DeckHost loads it (DeckHost --check-plugin, from DeckHost's latest release).
on:
  pull_request:
    paths: ["plugins/**", "tools/**", "mirror/**", ".github/workflows/mirror.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tools
        run: |
          python3 -I -m unittest discover -s tools -p 'test_*.py'
          python3 -c "import json; json.load(open('mirror/blocklist.json'))"
          if [[ -f mirror/snapshot.json ]]; then python3 -c "import json; json.load(open('mirror/snapshot.json'))"; fi

      - name: Changed entries
        id: changed
        run: |
          files="$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}"...HEAD -- 'plugins/*.json' | tr '\n' ' ')"
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Changed: ${files:-none}"

      - name: Fields
        run: python3 tools/catalog.py check ${{ steps.changed.outputs.files }}

      - name: Packages (download, checksum, DeckHost loads them)
        if: steps.changed.outputs.files != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/check-packages.sh ${{ steps.changed.outputs.files }}
