name: mirror

# The Elgato mirror for DeckHost's plugin store (tools/mirror.py):
#
#   - our own snapshot of the former Stream Deck Store (closed by Elgato in April 2024), in
#     mirror/snapshot.json on main, with a copy of the package for each plugin whose source
#     repository has an open-source license (the allowlist is in the script; everything else is
#     listed without a package) and its icon;
#   - the live Elgato Marketplace's public plugin list, each plugin with a link to its Marketplace
#     page. Nothing is downloaded from the Marketplace or copied.
#
# The snapshot is made once: Run workflow with "import". That reads the community archive, commits the
# icons to mirror-data and opens a pull request with mirror/snapshot.json. After that the archive is
# only read for packages that haven't been copied yet.
#
# ON by default. To pause it, set the repository variable ELGATO_MIRROR_ENABLED to "false"; to stop
# listing the Marketplace only, set ELGATO_MARKETPLACE_ENABLED to "false" (Settings → Secrets and
# variables → Actions → Variables). A manual run with "dry run" always works and only reports what
# it would do.
#
# Packages are assets of one rolling release (elgato-mirror); catalog.json, NOTICE.md,
# marketplace.json and icons/ go to the mirror-data branch (main is protected), which publish.yml puts
# on GitHub Pages under /mirror/. mirror/blocklist.json (reviewed, on main) lists plugins that are
# never copied or listed.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be mirrored"
        type: boolean
        default: true
      import:
        description: "Make the snapshot from the community archive (once): icons, and a pull request with mirror/snapshot.json"
        type: boolean
        default: false
      limit:
        description: "At most this many new packages (a first run can be spread over several)"
        required: false
        default: "100"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: vars.ELGATO_MIRROR_ENABLED != 'false' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      IMPORT: ${{ github.event_name == 'workflow_dispatch' && inputs.import }}
    steps:
      - uses: actions/checkout@v5

      - name: The mirror-data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin mirror-data >/dev/null; then
            git fetch --depth 1 origin mirror-data
            git worktree add -B mirror-data data FETCH_HEAD
          else
            git worktree add --orphan -b mirror-data data
          fi

      - name: Import the snapshot
        if: env.IMPORT == 'true'
        run: |
          python3 tools/mirror.py import --out imported | tail -n 20
          mkdir -p data/icons
          if compgen -G "imported/icons/*" >/dev/null; then cp imported/icons/* data/icons/; fi

      - name: The snapshot pull request
        if: env.IMPORT == 'true' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p mirror
          cp imported/snapshot.json mirror/snapshot.json
          if git ls-files --error-unmatch mirror/snapshot.json >/dev/null 2>&1 && git diff --quiet -- mirror/snapshot.json; then
            echo "The snapshot on main is the same."
            exit 0
          fi
          branch="mirror/snapshot-$(date -u +%Y-%m-%d)"
          git switch -c "$branch"
          git add mirror/snapshot.json
          git commit -m "Elgato mirror: our own snapshot of the former Stream Deck Store" -m "From the community archive's catalogue, by the mirror workflow (import)."
          git push --force origin "$branch"
          title="Elgato mirror: the snapshot"
          body="Our own copy of the community archive's catalogue of the former Stream Deck Store (id, name, author, link, version), made by the mirror workflow's import. Once merged, the mirror reads it instead of the archive. The icons are already on mirror-data."
          if pr="$(gh pr create --head "$branch" --title "$title" --body "$body")" \
             || pr="$(gh pr view "$branch" --json url --jq .url 2>/dev/null)"; then
            echo "$pr"
          else
            # Without "Allow GitHub Actions to create and approve pull requests" (Settings > Actions >
            # General) the token can push but not open the pull request: leave a link to open it by hand.
            compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/${{ github.event.repository.default_branch }}...$branch?expand=1"
            echo "::warning::Could not open the pull request. Open it from $compare"
            printf '### Elgato mirror snapshot\n\nThe branch `%s` is pushed; [open the pull request](%s).\n' \
              "$branch" "$compare" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Mirror
        env:
          GH_TOKEN: ${{ github.token }}
          LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '100' }}
          MARKETPLACE: ${{ vars.ELGATO_MARKETPLACE_ENABLED != 'false' }}
        run: |
          flags=(--limit "${LIMIT:-100}")
          if [[ "$DRY_RUN" == "true" ]]; then flags+=(--dry-run); fi
          if [[ "$MARKETPLACE" == "true" ]]; then flags+=(--marketplace); fi
          if [[ "$IMPORT" == "true" ]]; then flags+=(--catalogue imported/snapshot.json); fi
          python3 tools/mirror.py run --out out --previous data "${flags[@]}" | tee mirror.log
          {
            echo '### Elgato mirror'
            echo '```'
            grep -E '^(snapshot|marketplace|[0-9]+ plugins)' mirror.log || true
            echo '...'
            tail -n 40 mirror.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Packages (the rolling release)
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view elgato-mirror >/dev/null 2>&1; then
            gh release create elgato-mirror --title "Elgato plugin mirror" --latest=false --prerelease \
              --notes "Copies of open-source Stream Deck plugins for DeckHost's plugin store. See NOTICE.md on the project's GitHub Pages (/mirror/NOTICE.md). Made by the mirror workflow; do not edit by hand."
          fi
          if compgen -G "out/upload/*" >/dev/null; then
            gh release upload elgato-mirror out/upload/* --clobber
          fi
          while read -r asset; do
            [[ -z "$asset" ]] && continue
            gh release delete-asset elgato-mirror "$asset" --yes || true
          done < out/remove.txt

      - name: Commit to mirror-data
        id: commit
        if: env.DRY_RUN != 'true'
        run: |
          cp out/catalog.json out/NOTICE.md data/
          if [[ -f out/marketplace.json ]]; then cp out/marketplace.json data/; fi
          cd data
          if [[ -z "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "Nothing changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A
          git commit -m "Elgato mirror" -m "By the mirror workflow from the snapshot, the plugins' licenses and the Elgato Marketplace's list."
          git push origin mirror-data
          echo "changed=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: mirror
    if: needs.mirror.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
